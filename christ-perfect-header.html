<!-- ═══ PICKAXE HEADER — Paste into the HEADER field ═══ -->
<!-- This goes into the <head> tag -->

<style>
  /* ── Force dark background on Pickaxe page ──────────── */
  html, body, main, [class*="page"], [class*="Page"], [class*="section"], [class*="Section"], [class*="content"], [class*="Content"], [class*="wrapper"], [class*="Wrapper"] {
    background: #1a1a1a !important;
  }

  /* ── Remove Pickaxe container box styling ──────────── */
  [class*="card"], [class*="Card"], [class*="block"], [class*="Block"], [class*="container"], [class*="Container"], [class*="panel"], [class*="Panel"], [class*="box"], [class*="Box"],
  .cp-hero > *, .cp-hero div:not(.cp-hero__content):not([class^="cp-"]) {
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
  /* Nuclear option: strip ALL descendant styling inside hero except our own */
  .cp-hero * {
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
  .cp-hero .cp-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
    border-radius: 50px !important;
  }
  /* Restore our own card styles */
  .cp-card { background: var(--bg-card) !important; border: 1px solid var(--border) !important; border-radius: var(--radius) !important; }
  .cp-feature { background: var(--bg-card) !important; border: 1px solid var(--border) !important; border-radius: var(--radius) !important; }
  .cp-demo { background: var(--bg-card) !important; border: 1px solid var(--border) !important; border-radius: var(--radius) !important; }
  .cp-nav { background: rgba(17,17,17,.92) !important; border-bottom: 1px solid var(--border) !important; }

  /* ── Reset & Base ───────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #1a1a1a;
    --bg-card:  #242424;
    --bg-deep:  #111111;
    --border:   #333333;
    --text:     #d4d4d4;
    --text-dim: #888888;
    --white:    #f0f0f0;
    --accent:   #c9a84c;
    --accent2:  #a07c2a;
    --glow:     rgba(201,168,76,.15);
    --radius:   10px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    color: var(--text);
    line-height: 1.75;
    overflow-x: hidden;
  }
  a { color: var(--accent); text-decoration: none; transition: color .2s; }
  a:hover { color: var(--white); }
  h1, h2, h3, h4 { color: var(--white); font-weight: 700; line-height: 1.3; }
  .cp-container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  /* ── Nav ─────────────────────────────────────────────── */
  .cp-nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(17,17,17,.92); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .cp-nav__inner {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 960px; margin: 0 auto; padding: 0 24px; height: 56px;
  }
  .cp-nav__logo { font-size: 1.15rem; font-weight: 800; color: var(--white); letter-spacing: .5px; }
  .cp-nav__logo span { color: var(--accent); }
  .cp-nav__links { display: flex; gap: 24px; list-style: none; }
  .cp-nav__links a { color: var(--text); font-size: .8rem; font-weight: 500; font-family: sans-serif; text-transform: uppercase; letter-spacing: 1px; }
  .cp-nav__links a:hover { color: var(--accent); }
  .cp-nav__toggle { display: none; background: none; border: none; color: var(--white); font-size: 1.4rem; cursor: pointer; padding: 6px; }

  /* ── Hero ────────────────────────────────────────────── */
  .cp-hero {
    padding: 80px 24px 60px; text-align: center;
    position: relative; overflow: visible;
    background: #1a1a1a !important;
    z-index: 1;
  }
  .cp-hero::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 250%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(201,168,76,.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 10%, rgba(160,124,42,.05) 0%, transparent 60%),
      linear-gradient(to bottom, rgba(17,17,17,.6) 0%, transparent 60%);
  }
  .cp-hero__content { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; }
  .cp-hero__icon { font-size: 2.5rem; margin-bottom: 16px; opacity: .8; }
  .cp-hero__logo { width: 80px; height: auto; margin: 0 auto 20px; display: block; }
  .cp-hero h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); margin-bottom: 16px; letter-spacing: -.5px; }
  .cp-hero h1 span { color: var(--accent); }
  .cp-hero p { font-size: 1.05rem; color: var(--text); margin-bottom: 30px; max-width: 560px; margin-left: auto; margin-right: auto; }
  .cp-btn {
    display: inline-block; padding: 12px 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #111; font-weight: 700; font-size: .9rem; font-family: sans-serif;
    border: none; border-radius: 50px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px;
    transition: transform .2s, box-shadow .2s;
  }
  .cp-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--glow); color: #111; }

  /* ── Sections ───────────────────────────────────────── */
  .cp-section { padding: 60px 0; }
  .cp-section--alt { background: var(--bg); }
  .cp-label {
    text-transform: uppercase; letter-spacing: 3px; font-size: .75rem;
    color: var(--accent); font-weight: 700; margin-bottom: 10px;
    font-family: sans-serif;
  }
  .cp-title { font-size: clamp(1.5rem, 3.5vw, 2rem); margin-bottom: 14px; }
  .cp-sub { max-width: 640px; margin: 0 auto 40px; color: var(--text-dim); font-size: .95rem; text-align: center; }
  .cp-text-center { text-align: center; }

  /* ── Overview Cards ─────────────────────────────────── */
  .cp-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px; margin-top: 32px;
  }
  .cp-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 24px;
    transition: transform .2s, border-color .3s;
  }
  .cp-card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .cp-card__icon { font-size: 1.8rem; margin-bottom: 12px; }
  .cp-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .cp-card p { font-size: .88rem; color: var(--text-dim); line-height: 1.65; }

  /* ── Feature Blocks ─────────────────────────────────── */
  .cp-feature {
    display: flex; align-items: flex-start; gap: 28px;
    margin-bottom: 36px; padding: 28px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); transition: border-color .3s;
  }
  .cp-feature:hover { border-color: var(--accent); }
  .cp-feature__num {
    flex-shrink: 0; width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #111; font-weight: 800; font-size: 1.1rem; font-family: sans-serif;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .cp-feature__body h3 { font-size: 1.05rem; margin-bottom: 6px; }
  .cp-feature__body p { font-size: .88rem; color: var(--text-dim); line-height: 1.65; }
  .cp-feature__body ul { margin-top: 8px; padding-left: 18px; }
  .cp-feature__body li { font-size: .86rem; color: var(--text-dim); margin-bottom: 5px; line-height: 1.6; }
  .cp-feature__body li strong { color: var(--white); }

  /* ── Steps Timeline ─────────────────────────────────── */
  .cp-steps { counter-reset: cpstep; max-width: 640px; margin: 0 auto; }
  .cp-step {
    counter-increment: cpstep; position: relative;
    padding: 0 0 36px 58px;
    border-left: 2px solid var(--border);
  }
  .cp-step:last-child { border-left-color: transparent; padding-bottom: 0; }
  .cp-step::before {
    content: counter(cpstep);
    position: absolute; left: -16px; top: 0;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #111;
    font-family: sans-serif; font-weight: 800; font-size: .85rem;
    display: flex; align-items: center; justify-content: center;
  }
  .cp-step h3 { font-size: 1rem; margin-bottom: 4px; }
  .cp-step p { font-size: .88rem; color: var(--text-dim); line-height: 1.65; }
  .cp-step code {
    background: var(--bg-deep); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 4px; font-size: .82rem; color: var(--accent);
  }

  /* ── Demo Placeholder ───────────────────────────────── */
  .cp-demo {
    max-width: 720px; margin: 0 auto 32px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .cp-demo__inner {
    aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: var(--text-dim); font-family: sans-serif;
  }
  .cp-demo__play {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #111;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  .cp-demo__play:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--glow); }

  /* ── FAQ Accordion ──────────────────────────────────── */
  .cp-faq { max-width: 700px; margin: 0 auto; }
  .cp-faq__item { border-bottom: 1px solid var(--border); padding: 18px 0; }
  .cp-faq__item:first-child { border-top: 1px solid var(--border); }
  .cp-faq__q {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; width: 100%; background: none; border: none;
    color: var(--white); font-size: .95rem; font-family: Georgia, serif;
    text-align: left; padding: 0; line-height: 1.5;
  }
  .cp-faq__q::after {
    content: '+'; font-size: 1.3rem; color: var(--accent);
    flex-shrink: 0; margin-left: 14px; font-family: sans-serif;
    transition: transform .2s;
  }
  .cp-faq__item.open .cp-faq__q::after { content: '\2212'; }
  .cp-faq__a {
    max-height: 0; overflow: hidden; transition: max-height .3s ease;
    color: var(--text-dim); font-size: .88rem; line-height: 1.7;
  }
  .cp-faq__item.open .cp-faq__a { max-height: 400px; padding-top: 10px; }

  /* ── Footer ─────────────────────────────────────────── */
  .cp-footer {
    padding: 32px 0; text-align: center;
    border-top: 1px solid var(--border);
    color: var(--text-dim); font-size: .8rem; font-family: sans-serif;
  }
  .cp-footer a { color: var(--accent); }

  /* ── Scroll Reveal (JS-enhanced, visible by default) ── */
  .cp-reveal { opacity: 1; transform: translateY(0); transition: opacity .6s ease, transform .6s ease; }
  .cp-reveal-ready .cp-reveal { opacity: 0; transform: translateY(24px); }
  .cp-reveal-ready .cp-reveal.visible { opacity: 1; transform: translateY(0); }

  /* ── Responsive ─────────────────────────────────────── */
  @media (max-width: 768px) {
    .cp-nav__links {
      display: none; flex-direction: column; position: absolute;
      top: 56px; left: 0; width: 100%;
      background: rgba(17,17,17,.97); padding: 20px; gap: 16px;
      border-bottom: 1px solid var(--border);
    }
    .cp-nav__links.open { display: flex; }
    .cp-nav__toggle { display: block; }
    .cp-feature { flex-direction: column; gap: 14px; }
    .cp-hero { padding: 60px 20px 50px; }
    .cp-section { padding: 48px 0; }
  }
</style>
