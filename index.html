<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temecula Hills Christian Fellowship</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        black: '#000000',
                        white: '#FFFFFF',
                        dark: '#424242',
                        tealDark: '#0b6b6b',
                        tealLight: '#76cdbd',
                        cyan: '#4ecbcf',
                        orange: '#e2572e',
                        gold: '#f39615',
                    },
                    animation: {
                        blob: "blob 7s infinite",
                        slideIn: "slideIn 0.6s ease-out forwards",
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" }
                        },
                        slideIn: {
                            "0%": { opacity: "0", transform: "translateY(20px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" }
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Lucide replacement for standalone) ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
            >
                {children}
            </svg>
        );

        const Menu = (props) => (
            <IconWrapper {...props}><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></IconWrapper>
        );
        const X = (props) => (
            <IconWrapper {...props}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></IconWrapper>
        );
        const MapPin = (props) => (
            <IconWrapper {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></IconWrapper>
        );
        const Clock = (props) => (
            <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></IconWrapper>
        );
        const Calendar = (props) => (
            <IconWrapper {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></IconWrapper>
        );
        const ChevronRight = (props) => (
            <IconWrapper {...props}><path d="m9 18 6-6-6-6" /></IconWrapper>
        );
        const PlayCircle = (props) => (
            <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><polygon points="10 8 16 12 10 16 10 8" /></IconWrapper>
        );
        const Heart = (props) => (
            <IconWrapper {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></IconWrapper>
        );
        const Users = (props) => (
            <IconWrapper {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></IconWrapper>
        );

        // --- Theme Colors ---
        // (Also defined in tailwind config, but kept here for JS usage if needed)
        const colors = {
            black: '#000000',
            white: '#FFFFFF',
            dark: '#424242',
            tealDark: '#0b6b6b',
            tealLight: '#76cdbd',
            cyan: '#4ecbcf',
            orange: '#e2572e',
            gold: '#f39615',
        };

        // --- Custom SVGs for Branding ---

        const GeometricMountains = ({ className }) => (
            <svg viewBox="0 0 1200 300" className={className} preserveAspectRatio="none">
                <path d="M0,300 L200,100 L400,300 Z" fill={colors.tealDark} opacity="0.9" />
                <path d="M150,300 L350,150 L550,300 Z" fill={colors.orange} opacity="0.9" />
                <path d="M300,300 L500,80 L700,300 Z" fill={colors.dark} opacity="0.8" />
                <path d="M450,300 L650,180 L850,300 Z" fill={colors.tealLight} opacity="0.9" />
                <path d="M600,300 L800,120 L1000,300 Z" fill={colors.gold} opacity="0.9" />
                <path d="M850,300 L1050,160 L1250,300 Z" fill={colors.cyan} opacity="0.9" />
                <path d="M1000,300 L1200,50 L1400,300 Z" fill={colors.tealDark} opacity="0.8" />
            </svg>
        );

        const Logo = () => (
            <div className="flex items-center gap-2">
                <div className="relative w-10 h-10 overflow-hidden rounded-full bg-white border-2 border-gray-800 flex items-center justify-center">
                    <svg viewBox="0 0 100 100" className="w-8 h-8 mt-2">
                        <path d="M10,90 L35,40 L60,90 Z" fill={colors.dark} />
                        <path d="M40,90 L65,30 L90,90 Z" fill={colors.dark} />
                    </svg>
                </div>
                <div className="flex flex-col leading-tight">
                    <span className="font-bold text-lg tracking-wider text-gray-800">TEMECULA HILLS</span>
                    <span className="text-xs tracking-widest text-gray-500">CHRISTIAN FELLOWSHIP</span>
                </div>
            </div>
        );
        // --- Components ---

        const NavItem = ({ label, href, delay, onClick, isOpen }) => (
            <a
                href={href}
                onClick={onClick}
                className={`block text-4xl md:text-6xl font-black text-white hover:text-orange duration-300 transform hover:translate-x-4 mb-6 md:mb-8 transition-all ${isOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}
                style={{ transitionDelay: `${isOpen ? delay : 0}ms`, transitionDuration: '500ms' }}
            >
                {label}
            </a>
        );

        const FullScreenMenu = ({ isOpen, onClose }) => {
            const [isRendered, setIsRendered] = useState(isOpen);
            const [shouldAnimate, setShouldAnimate] = useState(false);

            useEffect(() => {
                if (isOpen) {
                    setIsRendered(true);
                    setTimeout(() => setShouldAnimate(true), 50);
                } else {
                    setShouldAnimate(false);
                    const timer = setTimeout(() => setIsRendered(false), 700); // Wait for circular animation
                    return () => clearTimeout(timer);
                }
            }, [isOpen]);

            if (!isRendered) return null;

            return (
                <div
                    className="fixed inset-0 z-50 flex flex-col bg-dark overflow-hidden transition-all duration-700 ease-[cubic-bezier(0.76,0,0.24,1)]"
                    style={{
                        clipPath: shouldAnimate ? 'circle(150% at calc(100% - 40px) 40px)' : 'circle(0% at calc(100% - 40px) 40px)'
                    }}
                >
                    <div className="flex justify-between items-center p-6 md:p-12 relative z-10">
                        <div className="text-white font-bold tracking-widest text-sm transition-opacity duration-300 delay-300" style={{ opacity: shouldAnimate ? 1 : 0 }}>MENU</div>
                        <button onClick={onClose} className="text-white hover:text-orange transition-colors">
                            <X size={32} />
                        </button>
                    </div>

                    <div className="flex-1 flex flex-col justify-center px-8 md:px-24 relative z-10">
                        <nav>
                            <NavItem label="HOME" href="#" delay={shouldAnimate ? 300 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="ABOUT US" href="#about" delay={shouldAnimate ? 400 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="MINISTRIES" href="#ministries" delay={shouldAnimate ? 500 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="SERMONS" href="#sermons" delay={shouldAnimate ? 600 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="GIVING" href="#give" delay={shouldAnimate ? 700 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="CONTACT" href="#contact" delay={shouldAnimate ? 800 : 0} onClick={onClose} isOpen={shouldAnimate} />
                        </nav>
                    </div>

                    <div className="absolute bottom-0 right-0 w-full h-32 opacity-20 pointer-events-none transition-opacity duration-500 delay-300" style={{ opacity: shouldAnimate ? 0.2 : 0 }}>
                        <GeometricMountains className="w-full h-full" />
                    </div>
                </div>
            );
        };

        const SectionHeading = ({ children, color = "text-gray-800" }) => (
            <h2 className={`text-3xl md:text-5xl font-black mb-8 uppercase tracking-tight ${color}`}>
                {children}
            </h2>
        );

        const ServiceCard = ({ icon: Icon, title, time, description, color }) => (
            <div className="bg-white p-8 rounded-xl shadow-lg border-l-8 hover:transform hover:-translate-y-2 transition-all duration-300 group"
                style={{ borderColor: color }}>
                <div className="mb-4 p-3 rounded-full w-fit text-white group-hover:scale-110 transition-transform" style={{ backgroundColor: color }}>
                    <Icon size={24} />
                </div>
                <h3 className="text-xl font-bold mb-2 text-gray-800">{title}</h3>
                <p className="text-gray-500 font-medium mb-3 flex items-center gap-2">
                    <Clock size={16} /> {time}
                </p>
                <p className="text-gray-600 leading-relaxed">{description}</p>
            </div>
        );

        // --- Hook for Scroll Animations ---
        const useOnScreen = (options) => {
            const [ref, setRef] = useState(null);
            const [visible, setVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setVisible(true);
                        observer.disconnect(); // Once visible, stay visible
                    }
                }, options);

                if (ref) {
                    observer.observe(ref);
                }

                return () => {
                    if (ref) observer.unobserve(ref);
                };
            }, [ref, options]);

            return [setRef, visible];
        };

        const RevealOnScroll = ({ children, delay = 0 }) => {
            const [setRef, visible] = useOnScreen({ threshold: 0.1 });

            return (
                <div
                    ref={setRef}
                    className={`transition-all duration-1000 transform ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };
        function App() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [scrollValue, setScrollValue] = useState(0);
            const [activeHeroWord, setActiveHeroWord] = useState(0);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                    setScrollValue(window.scrollY);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                const interval = setInterval(() => {
                    setActiveHeroWord((prev) => (prev + 1) % 3);
                }, 2000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen selection:bg-tealLight selection:text-white">
                    <FullScreenMenu isOpen={isMenuOpen} onClose={() => setIsMenuOpen(false)} />

                    <header
                        className={`fixed top-0 left-0 right-0 z-40 transition-all duration-300 px-6 py-4 flex justify-between items-center ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-sm py-3' : 'bg-transparent py-6'
                            }`}
                    >
                        <Logo />

                        {/* Desktop Nav Links */}
                        <nav className="hidden md:flex items-center gap-8 absolute left-1/2 transform -translate-x-1/2">
                            {[
                                { label: 'Who We Are', href: '#about' },
                                { label: "I'm New", href: '#im-new' },
                                { label: 'Sermons', href: '#sermons' }
                            ].map((item) => (
                                <a
                                    key={item.label}
                                    href={item.href}
                                    onClick={(e) => {
                                        e.preventDefault();
                                        const el = document.querySelector(item.href);
                                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                                    }}
                                    className={`font-bold tracking-widest text-sm uppercase hover:text-orange transition-colors ${scrolled ? 'text-gray-800' : 'text-white'}`}
                                >
                                    {item.label}
                                </a>
                            ))}
                        </nav>
                        <button
                            onClick={() => setIsMenuOpen(true)}
                            className="group flex items-center gap-3 bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full transition-all"
                        >
                            <span className="hidden md:block font-bold text-sm tracking-widest uppercase text-gray-800">Menu</span>
                            <div className="p-2 bg-dark text-white rounded-full group-hover:bg-orange transition-colors">
                                <Menu size={20} />
                            </div>
                        </button>
                    </header>

                    {/* --- Hero Section --- */}
                    <section className="relative h-screen min-h-[600px] flex items-center justify-center bg-dark text-white overflow-hidden">
                        {/* Background Video */}
                        <div className="absolute inset-0 z-0 overflow-hidden bg-black">
                            <video
                                autoPlay
                                loop
                                muted
                                playsInline
                                className="absolute inset-0 w-full h-full object-cover opacity-60"
                            >
                                <source src="https://assets.cdn.filesafe.space/aDyCJfFox0W1sWUghjwp/media/69ad98f080d35909a25a3ace.mp4" type="video/mp4" />
                            </video>
                            {/* Dark overlay for text readability */}
                            <div className="absolute inset-0 bg-black/50"></div>
                        </div>
                        {/* Background Geometric Elements */}
                        <div className="absolute inset-0 z-0 opacity-20 pointer-events-none">
                            <div className="absolute top-20 left-10 w-64 h-64 bg-tealLight rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
                            <div className="absolute top-20 right-10 w-64 h-64 bg-gold rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
                            <div className="absolute bottom-20 left-1/2 w-64 h-64 bg-orange rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
                        </div>

                        <div className="relative z-10 text-center px-4 max-w-4xl mx-auto mt-16">
                            <span className="inline-block py-1 px-3 rounded-full bg-gold text-xs font-bold tracking-widest mb-6 animate-[slideIn_0.6s_ease-out_forwards]">
                                WELCOME HOME
                            </span>
                            <h1 className="text-4xl md:text-7xl lg:text-8xl font-black tracking-tighter mb-6 leading-none animate-[slideIn_0.6s_ease-out_forwards]" style={{ animationDelay: '100ms' }}>
                                <span className={`transition-colors duration-700 ${activeHeroWord === 0 ? 'text-cyan' : 'text-white'}`}>FAITH.</span><br />
                                <span className={`transition-colors duration-700 ${activeHeroWord === 1 ? 'text-cyan' : 'text-white'}`}>FAMILY.</span><br />
                                <span className={`transition-colors duration-700 ${activeHeroWord === 2 ? 'text-cyan' : 'text-white'}`}>FELLOWSHIP.</span>
                            </h1>
                            <p className="text-lg md:text-2xl text-gray-300 mb-10 max-w-2xl mx-auto animate-[slideIn_0.6s_ease-out_forwards]" style={{ animationDelay: '200ms' }}>
                                Loving God and loving people in the Temecula Valley. Join us this Sunday.
                            </p>
                            <div className="flex flex-col md:flex-row gap-4 justify-center animate-[slideIn_0.6s_ease-out_forwards]" style={{ animationDelay: '300ms' }}>
                                <button onClick={() => { const el = document.querySelector('#im-new'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }} className="px-8 py-4 bg-orange text-white font-bold rounded-lg hover:bg-[#c9451f] transition-all transform hover:scale-105 shadow-lg flex items-center justify-center gap-2">
                                    I'm New <ChevronRight size={18} />
                                </button>
                                <button onClick={() => { const el = document.querySelector('#sermons'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }} className="px-8 py-4 bg-transparent border-2 border-white/30 text-white font-bold rounded-lg hover:bg-white/10 transition-all flex items-center justify-center gap-2">
                                    Sermons <PlayCircle size={18} />
                                </button>
                            </div>
                        </div>

                        <div
                            className="absolute bottom-0 w-full pointer-events-none origin-bottom will-change-transform"
                            style={{ transform: `scaleY(${1 + scrollValue * 0.002})` }}
                        >
                            <GeometricMountains className="w-full h-[15vh] md:h-[25vh] translate-y-1" />
                        </div>
                    </section>

                    {/* --- Service Times / Info --- */}
                    <section className="py-20 px-6 bg-white relative z-20">
                        <div className="max-w-6xl mx-auto -mt-32 relative z-30 grid md:grid-cols-3 gap-6">
                            <RevealOnScroll delay={0}>
                                <ServiceCard
                                    icon={Clock}
                                    title="Sunday Service"
                                    time="10:00 AM"
                                    description="Join us for worship and biblical teaching. Kids ministry available for all ages."
                                    color={colors.orange}
                                />
                            </RevealOnScroll>
                            <RevealOnScroll delay={200}>
                                <ServiceCard
                                    icon={Users}
                                    title="Youth Group"
                                    time="Wednesdays 7:00 PM"
                                    description="High energy worship and small groups for Middle & High School students."
                                    color={colors.cyan}
                                />
                            </RevealOnScroll>
                            <RevealOnScroll delay={400}>
                                <ServiceCard
                                    icon={Heart}
                                    title="Prayer Meeting"
                                    time="Tuesdays 6:30 PM"
                                    description="A time to come together and seek God's face for our church and city."
                                    color={colors.gold}
                                />
                            </RevealOnScroll>
                        </div>
                    </section>

                    {/* --- Sermon Section --- */}
                    <section id="sermons" className="py-24 bg-tealDark text-white relative overflow-hidden">
                        {/* Decorative Mountains */}
                        <div className="absolute bottom-0 left-0 w-2/3 opacity-10 pointer-events-none transform -scale-x-100">
                            <GeometricMountains className="w-full h-auto" />
                        </div>
                        <div className="absolute bottom-0 right-0 w-2/3 opacity-10 pointer-events-none">
                            <GeometricMountains className="w-full h-auto" />
                        </div>

                        <div className="max-w-6xl mx-auto px-6 relative z-10">
                            <div className="grid lg:grid-cols-2 gap-12 items-center">
                                <RevealOnScroll>
                                    <div>
                                        <span className="text-gold font-bold tracking-widest uppercase text-sm mb-2 block">Latest Message</span>
                                        <h2 className="text-4xl md:text-5xl font-black mb-6">THE POWER OF PRAYER</h2>
                                        <p className="text-teal-100 text-lg mb-8 leading-relaxed">
                                            Join us as we dive deep into what it means to communicate with God. In this series, we explore the biblical foundations of prayer and how it changes our lives.
                                        </p>
                                        <div className="flex flex-wrap gap-4">
                                            <button className="px-8 py-4 bg-gold text-white font-bold rounded-lg hover:bg-yellow-500 transition-all transform hover:scale-105 shadow-lg flex items-center gap-2">
                                                <PlayCircle size={20} />
                                                Watch Sermon
                                            </button>
                                            <button className="px-8 py-4 bg-transparent border-2 border-white/30 text-white font-bold rounded-lg hover:bg-white/10 transition-all flex items-center gap-2">
                                                Sermon Notes <ChevronRight size={20} />
                                            </button>
                                        </div>
                                    </div>
                                </RevealOnScroll>

                                <RevealOnScroll delay={200}>
                                    <div className="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border-4 border-white/10 group">
                                        {/* Video Placeholder / Thumbnail Area */}
                                        <div className="absolute inset-0 flex items-center justify-center bg-gray-900 group-hover:bg-gray-800 transition-colors cursor-pointer">
                                            <div className="bg-red-600 rounded-full p-4 shadow-lg group-hover:scale-110 transition-transform">
                                                <PlayCircle size={48} fill="white" className="text-white" />
                                            </div>
                                        </div>
                                        <iframe
                                            className="absolute inset-0 w-full h-full opacity-0 hover:opacity-100 transition-opacity z-10"
                                            src="https://www.youtube.com/embed/QbdeVeZl1j0?controls=0"
                                            title="YouTube video player"
                                            frameBorder="0"
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                            allowFullScreen
                                        ></iframe>
                                    </div>
                                </RevealOnScroll>
                            </div>
                        </div>
                    </section>
                    {/* --- About Section --- */}
                    <section id="about" className="py-24 px-6 bg-gray-50 flex items-center overflow-hidden">
                        <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-12 items-center">
                            <RevealOnScroll>
                                <div className="relative">
                                    {/* Abstract Image Placeholder Composition */}
                                    <div className="relative h-[500px] w-full bg-gray-200 rounded-2xl overflow-hidden shadow-2xl group cursor-pointer">
                                        <div className="absolute inset-0 bg-dark flex items-center justify-center transition-transform group-hover:scale-105 duration-700">
                                            <span className="text-gray-500 font-bold text-xl">[Place Church Photo Here]</span>
                                        </div>
                                        <div className="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-tealDark to-transparent opacity-60"></div>
                                    </div>
                                    {/* Floating decoration - Animations removed per user request */}
                                </div>
                            </RevealOnScroll>

                            <div>
                                <RevealOnScroll delay={200}>
                                    <span className="text-orange font-bold tracking-widest uppercase text-sm mb-2 block">Who We Are</span>
                                    <SectionHeading>A Community <br /> on a Mission</SectionHeading>
                                    <p className="text-gray-600 text-lg leading-relaxed mb-6">
                                        We are a community of believers in Temecula, CA, dedicated to knowing Jesus and making Him known. Our church is more than a building; it's a family where everyone is welcome.
                                    </p>
                                    <p className="text-gray-600 text-lg leading-relaxed mb-8">
                                        Whether you have been a Christian for years or are just exploring faith, there is a place for you here at Temecula Hills.
                                    </p>
                                    <a href="#ministries" className="text-tealDark font-bold text-lg hover:underline flex items-center gap-2 group">
                                        Learn More <ChevronRight size={20} className="group-hover:translate-x-1 transition-transform" />
                                    </a>
                                </RevealOnScroll>
                            </div>
                        </div>
                    </section>

                    {/* --- I'm New Section --- */}
                    <div className="relative">
                        {/* Slanted Separator */}
                        <div className="absolute top-0 left-0 w-full overflow-hidden leading-none z-10 transform -translate-y-full">
                            <svg className="relative block w-full h-[100px]" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                                <path d="M1200 120L0 16.48 0 0 1200 0 1200 120z" className="fill-gray-100"></path>
                            </svg>
                        </div>

                        <section id="im-new" className="py-24 px-6 bg-gray-100 relative overflow-hidden">
                            {/* Background Blobs */}
