<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temecula Hills Christian Fellowship</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        black: '#000000',
                        white: '#FFFFFF',
                        dark: '#424242',
                        tealDark: '#0b6b6b',
                        tealLight: '#76cdbd',
                        cyan: '#4ecbcf',
                        orange: '#e2572e',
                        gold: '#f39615',
                    },
                    animation: {
                        blob: "blob 7s infinite",
                        slideIn: "slideIn 0.6s ease-out forwards",
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" }
                        },
                        slideIn: {
                            "0%": { opacity: "0", transform: "translateY(20px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" }
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Lucide replacement for standalone) ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
            >
                {children}
            </svg>
        );

        const Menu = (props) => (
            <IconWrapper {...props}><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></IconWrapper>
        );
        const X = (props) => (
            <IconWrapper {...props}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></IconWrapper>
        );
        const MapPin = (props) => (
            <IconWrapper {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></IconWrapper>
        );
        const Clock = (props) => (
            <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></IconWrapper>
        );
        const Calendar = (props) => (
            <IconWrapper {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></IconWrapper>
        );
        const ChevronRight = (props) => (
            <IconWrapper {...props}><path d="m9 18 6-6-6-6" /></IconWrapper>
        );
        const PlayCircle = (props) => (
            <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><polygon points="10 8 16 12 10 16 10 8" /></IconWrapper>
        );
        const Heart = (props) => (
            <IconWrapper {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></IconWrapper>
        );
        const Users = (props) => (
            <IconWrapper {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></IconWrapper>
        );
        // Brand-glyph icons rendered with currentColor fill for hover transitions.
        const FacebookIcon = ({ size = 18 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.84c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z" />
            </svg>
        );
        const InstagramIcon = ({ size = 18 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
            </svg>
        );
        const YouTubeIcon = ({ size = 18 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z" />
            </svg>
        );

        // --- Theme Colors ---
        // (Also defined in tailwind config, but kept here for JS usage if needed)
        const colors = {
            black: '#000000',
            white: '#FFFFFF',
            dark: '#424242',
            tealDark: '#0b6b6b',
            tealLight: '#76cdbd',
            cyan: '#4ecbcf',
            orange: '#e2572e',
            gold: '#f39615',
        };

        // --- Custom SVGs for Branding ---

        const GeometricMountains = ({ className, tone = "dark" }) => {
            const fills = tone === "light"
                ? { back: "rgba(255,255,255,0.08)", mid: "rgba(255,255,255,0.14)", front: "rgba(255,255,255,0.22)" }
                : { back: "rgba(11,107,107,0.35)", mid: "rgba(66,66,66,0.55)", front: colors.dark };
            return (
                <svg viewBox="0 0 1200 300" className={className} preserveAspectRatio="none" aria-hidden="true">
                    <path d="M0,300 L220,140 L420,300 Z" fill={fills.back} />
                    <path d="M280,300 L520,90 L760,300 Z" fill={fills.back} />
                    <path d="M640,300 L880,150 L1100,300 Z" fill={fills.back} />
                    <path d="M120,300 L380,170 L640,300 Z" fill={fills.mid} />
                    <path d="M520,300 L780,110 L1040,300 Z" fill={fills.mid} />
                    <path d="M0,300 L260,200 L520,300 Z" fill={fills.front} />
                    <path d="M460,300 L720,160 L980,300 Z" fill={fills.front} />
                    <path d="M860,300 L1100,210 L1200,300 L1200,300 Z" fill={fills.front} />
                </svg>
            );
        };

        const Logo = () => (
            <div className="flex items-center gap-2">
                <div className="relative w-10 h-10 overflow-hidden rounded-full bg-white border-2 border-gray-800 flex items-center justify-center">
                    <svg viewBox="0 0 100 100" className="w-8 h-8 mt-2">
                        <path d="M10,90 L35,40 L60,90 Z" fill={colors.dark} />
                        <path d="M40,90 L65,30 L90,90 Z" fill={colors.dark} />
                    </svg>
                </div>
                <div className="flex flex-col leading-tight">
                    <span className="font-bold text-lg tracking-wider text-gray-800">TEMECULA HILLS</span>
                    <span className="text-xs tracking-widest text-gray-500">CHRISTIAN FELLOWSHIP</span>
                </div>
            </div>
        );
        // --- Components ---

        const NavItem = ({ label, href, delay, onClick, isOpen }) => (
            <a
                href={href}
                onClick={onClick}
                className={`block text-4xl md:text-6xl font-black text-white hover:text-orange duration-300 transform hover:translate-x-4 mb-6 md:mb-8 transition-all ${isOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}
                style={{ transitionDelay: `${isOpen ? delay : 0}ms`, transitionDuration: '500ms' }}
            >
                {label}
            </a>
        );

        const FullScreenMenu = ({ isOpen, onClose }) => {
            const [isRendered, setIsRendered] = useState(isOpen);
            const [shouldAnimate, setShouldAnimate] = useState(false);

            useEffect(() => {
                if (isOpen) {
                    setIsRendered(true);
                    setTimeout(() => setShouldAnimate(true), 50);
                } else {
                    setShouldAnimate(false);
                    const timer = setTimeout(() => setIsRendered(false), 700); // Wait for circular animation
                    return () => clearTimeout(timer);
                }
            }, [isOpen]);

            if (!isRendered) return null;

            return (
                <div
                    className="fixed inset-0 z-50 flex flex-col bg-dark overflow-hidden transition-all duration-700 ease-[cubic-bezier(0.76,0,0.24,1)]"
                    style={{
                        clipPath: shouldAnimate ? 'circle(150% at calc(100% - 40px) 40px)' : 'circle(0% at calc(100% - 40px) 40px)'
                    }}
                >
                    <div className="flex justify-between items-center p-6 md:p-12 relative z-10">
                        <div className="text-white font-bold tracking-widest text-sm transition-opacity duration-300 delay-300" style={{ opacity: shouldAnimate ? 1 : 0 }}>MENU</div>
                        <button onClick={onClose} className="text-white hover:text-orange transition-colors">
                            <X size={32} />
                        </button>
                    </div>

                    <div className="flex-1 grid md:grid-cols-[1.4fr_1fr] gap-12 px-8 md:px-24 pb-12 relative z-10 items-center">
                        <nav>
                            <NavItem label="HOME" href="#" delay={shouldAnimate ? 300 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="I'M NEW" href="im-new.html" delay={shouldAnimate ? 400 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="ABOUT" href="#about" delay={shouldAnimate ? 500 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="SERMONS" href="#sermons" delay={shouldAnimate ? 600 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            {/* TODO: replace href with church giving URL (Pushpay/Tithe.ly/etc.) when set up. */}
                            <NavItem label="GIVE" href="#contact" delay={shouldAnimate ? 700 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="CONTACT" href="#contact" delay={shouldAnimate ? 800 : 0} onClick={onClose} isOpen={shouldAnimate} />
                        </nav>

                        <aside
                            className="hidden md:block text-white/90 transition-all duration-700"
                            style={{ opacity: shouldAnimate ? 1 : 0, transform: shouldAnimate ? 'translateY(0)' : 'translateY(20px)', transitionDelay: shouldAnimate ? '600ms' : '0ms' }}
                        >
                            <div className="border-l-2 border-orange pl-6 mb-8">
                                <div className="text-gold text-xs font-bold tracking-widest uppercase mb-2">Join Us</div>
                                <div className="font-bold text-lg leading-snug mb-1">Sundays at 8:45 & 10:30 AM</div>
                                <div className="text-white/70 text-sm">Wednesdays · Youth 7:00 PM</div>
                            </div>
                            <div className="border-l-2 border-tealLight pl-6 mb-8">
                                <div className="text-tealLight text-xs font-bold tracking-widest uppercase mb-2">Visit</div>
                                <div className="text-white/85 text-sm leading-relaxed">
                                    28780 Single Oak Drive<br />
                                    Temecula, CA 92590
                                </div>
                            </div>
                            <a
                                href="im-new.html#plan-visit"
                                onClick={onClose}
                                className="inline-flex items-center gap-2 px-6 py-3 bg-orange hover:bg-[#c9451f] text-white font-bold rounded-lg transition-all"
                            >
                                Plan Your Visit <ChevronRight size={18} />
                            </a>
                        </aside>
                    </div>

                    <div className="absolute bottom-0 right-0 w-full h-32 opacity-30 pointer-events-none transition-opacity duration-500 delay-300" style={{ opacity: shouldAnimate ? 0.3 : 0 }}>
                        <GeometricMountains className="w-full h-full" tone="light" />
                    </div>
                </div>
            );
        };

        const SectionHeading = ({ children, color = "text-gray-800" }) => (
            <h2 className={`text-3xl md:text-5xl font-bold mb-8 tracking-tight leading-tight ${color}`}>
                {children}
            </h2>
        );

        const ServiceCard = ({ icon: Icon, title, time, description, color }) => (
            <div className="bg-white p-8 rounded-xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 group ring-1 ring-gray-100">
                <div className="mb-5 p-3 rounded-xl w-fit text-white shadow-sm group-hover:scale-110 transition-transform" style={{ backgroundColor: color }}>
                    <Icon size={22} />
                </div>
                <h3 className="text-xl font-bold mb-2 text-gray-800">{title}</h3>
                <p className="text-gray-500 font-medium mb-3 flex items-center gap-2 text-sm">
                    <Clock size={14} /> {time}
                </p>
                <p className="text-gray-600 leading-relaxed">{description}</p>
            </div>
        );

        // --- Hook for Scroll Animations ---
        const useOnScreen = (options) => {
            const [ref, setRef] = useState(null);
            const [visible, setVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setVisible(true);
                        observer.disconnect(); // Once visible, stay visible
                    }
                }, options);

                if (ref) {
                    observer.observe(ref);
                }

                return () => {
                    if (ref) observer.unobserve(ref);
                };
            }, [ref, options]);

            return [setRef, visible];
        };

        const SermonPlayer = ({ videoId, title }) => {
            const [playing, setPlaying] = useState(false);
            const thumb = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
            return (
                <div className="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border-4 border-white/10 group">
                    {playing ? (
                        <iframe
                            className="absolute inset-0 w-full h-full"
                            src={`https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`}
                            title={title}
                            frameBorder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowFullScreen
                        ></iframe>
                    ) : (
                        <button
                            onClick={() => setPlaying(true)}
                            className="absolute inset-0 w-full h-full cursor-pointer focus:outline-none focus-visible:ring-4 focus-visible:ring-orange/60"
                            aria-label={`Play sermon: ${title}`}
                        >
                            <img
                                src={thumb}
                                alt=""
                                className="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                                loading="lazy"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
                            <div className="absolute inset-0 flex items-center justify-center">
                                <div className="bg-orange rounded-full p-5 shadow-2xl group-hover:scale-110 transition-transform">
                                    <PlayCircle size={44} className="text-white" />
                                </div>
                            </div>
                        </button>
                    )}
                </div>
            );
        };

        const RevealOnScroll = ({ children, delay = 0 }) => {
            const [setRef, visible] = useOnScreen({ threshold: 0.1 });

            return (
                <div
                    ref={setRef}
                    className={`transition-all duration-1000 transform ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };
        function App() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [scrollValue, setScrollValue] = useState(0);
            const [activeHeroWord, setActiveHeroWord] = useState(0);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                    setScrollValue(window.scrollY);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                // Single staggered reveal on load, then settle — no perpetual flicker.
                const t1 = setTimeout(() => setActiveHeroWord(1), 600);
                const t2 = setTimeout(() => setActiveHeroWord(2), 1100);
                const t3 = setTimeout(() => setActiveHeroWord(3), 1700);
                return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
            }, []);

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen selection:bg-tealLight selection:text-white">
                    <FullScreenMenu isOpen={isMenuOpen} onClose={() => setIsMenuOpen(false)} />

                    <header
                        className={`fixed top-0 left-0 right-0 z-40 transition-all duration-300 px-6 py-4 flex justify-between items-center ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-sm py-3' : 'bg-transparent py-6'
                            }`}
                    >
                        <Logo />

                        <button
                            onClick={() => setIsMenuOpen(true)}
                            className={`group flex items-center gap-3 px-4 py-2 rounded-full transition-all ${scrolled ? 'bg-gray-100 hover:bg-gray-200' : 'bg-white/10 hover:bg-white/20 backdrop-blur-sm'}`}
                            aria-label="Open navigation menu"
                        >
                            <span className={`hidden md:block font-bold text-sm tracking-widest uppercase transition-colors ${scrolled ? 'text-gray-800' : 'text-white'}`}>Menu</span>
                            <div className="p-2 bg-dark text-white rounded-full group-hover:bg-orange transition-colors">
                                <Menu size={20} />
                            </div>
                        </button>
                    </header>

                    {/* --- Hero Section --- */}
                    <section className="relative h-screen min-h-[600px] flex items-center justify-center bg-dark text-white overflow-hidden">
                        {/* Background Video */}
                        <div className="absolute inset-0 z-0 overflow-hidden bg-black">
                            <video
                                autoPlay
                                loop
                                muted
                                playsInline
                                poster="https://assets.cdn.filesafe.space/aDyCJfFox0W1sWUghjwp/media/69ad98f080d35909a25a3ace.mp4"
                                className="absolute inset-0 w-full h-full object-cover"
                            >
                                <source src="https://assets.cdn.filesafe.space/aDyCJfFox0W1sWUghjwp/media/69ad98f080d35909a25a3ace.mp4" type="video/mp4" />
                            </video>
                            {/* Vertical gradient overlay — guarantees text legibility regardless of video frame. */}
                            <div className="absolute inset-0 bg-gradient-to-b from-black/75 via-black/45 to-black/80"></div>
                        </div>

                        <div className="relative z-10 text-center px-4 max-w-4xl mx-auto mt-16">
                            <span className="inline-block py-1.5 px-4 rounded-full bg-gold/90 text-black text-xs font-bold tracking-widest mb-6 animate-[slideIn_0.6s_ease-out_forwards] shadow-md">
                                SUNDAYS · 10 AM · TEMECULA, CA
                            </span>
                            <h1 className="text-4xl md:text-7xl lg:text-8xl font-black tracking-tighter mb-6 leading-none animate-[slideIn_0.6s_ease-out_forwards]" style={{ animationDelay: '100ms' }}>
                                <span className={`transition-colors duration-700 ${activeHeroWord >= 1 ? 'text-cyan' : 'text-white'}`}>FAITH.</span><br />
                                <span className={`transition-colors duration-700 ${activeHeroWord >= 2 ? 'text-cyan' : 'text-white'}`}>FAMILY.</span><br />
                                <span className={`transition-colors duration-700 ${activeHeroWord >= 3 ? 'text-cyan' : 'text-white'}`}>FELLOWSHIP.</span>
                            </h1>
                            <p className="text-lg md:text-2xl text-gray-200 mb-10 max-w-2xl mx-auto animate-[slideIn_0.6s_ease-out_forwards]" style={{ animationDelay: '200ms' }}>
                                Loving God and loving people in the Temecula Valley. Join us this Sunday.
                            </p>
                            <div className="flex flex-col md:flex-row gap-4 justify-center animate-[slideIn_0.6s_ease-out_forwards]" style={{ animationDelay: '300ms' }}>
                                <a href="im-new.html" className="px-8 py-4 bg-orange text-white font-bold rounded-lg hover:bg-[#c9451f] transition-all transform hover:scale-105 shadow-lg flex items-center justify-center gap-2">
                                    I'm New <ChevronRight size={18} />
                                </a>
                                <button onClick={() => { const el = document.querySelector('#sermons'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }} className="px-8 py-4 bg-white/10 backdrop-blur-sm border-2 border-white/60 text-white font-bold rounded-lg hover:bg-white/20 transition-all flex items-center justify-center gap-2">
                                    Sermons <PlayCircle size={18} />
                                </button>
                            </div>
                        </div>

                        <div
                            className="absolute bottom-0 w-full pointer-events-none origin-bottom will-change-transform"
                            style={{ transform: `scaleY(${1 + scrollValue * 0.002})` }}
                        >
                            <GeometricMountains className="w-full h-[15vh] md:h-[25vh] translate-y-1" />
                        </div>
                    </section>

                    {/* --- Service Times / Info --- */}
                    <section className="py-20 px-6 bg-white relative z-20">
                        <div className="max-w-6xl mx-auto -mt-32 relative z-30 grid md:grid-cols-3 gap-6">
                            <RevealOnScroll delay={0}>
                                <ServiceCard
                                    icon={Clock}
                                    title="Sunday Worship"
                                    time="8:45 & 10:30 AM"
                                    description="Two services every Sunday — same teaching, same flow. Kids ministry available at both."
                                    color={colors.orange}
                                />
                            </RevealOnScroll>
                            <RevealOnScroll delay={200}>
                                <ServiceCard
                                    icon={Users}
                                    title="Youth Group"
                                    time="Wednesdays 7:00 PM"
                                    description="High energy worship and small groups for Middle & High School students."
                                    color={colors.cyan}
                                />
                            </RevealOnScroll>
                            <RevealOnScroll delay={400}>
                                <ServiceCard
                                    icon={Heart}
                                    title="Prayer Meeting"
                                    time="Tuesdays 6:30 PM"
                                    description="A time to come together and seek God's face for our church and city."
                                    color={colors.gold}
                                />
                            </RevealOnScroll>
                        </div>
                    </section>

                    {/* --- Sermon Section --- */}
                    <section id="sermons" className="py-24 bg-tealDark text-white relative overflow-hidden">
                        {/* Decorative Mountains */}
                        <div className="absolute bottom-0 left-0 w-2/3 opacity-10 pointer-events-none transform -scale-x-100">
                            <GeometricMountains className="w-full h-auto" />
                        </div>
                        <div className="absolute bottom-0 right-0 w-2/3 opacity-10 pointer-events-none">
                            <GeometricMountains className="w-full h-auto" />
                        </div>

                        <div className="max-w-6xl mx-auto px-6 relative z-10">
                            <div className="grid lg:grid-cols-2 gap-12 items-center">
