<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm New | Temecula Hills Christian Fellowship</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        black: '#000000',
                        white: '#FFFFFF',
                        dark: '#424242',
                        tealDark: '#0b6b6b',
                        tealLight: '#76cdbd',
                        cyan: '#4ecbcf',
                        orange: '#e2572e',
                        gold: '#f39615',
                    },
                    animation: {
                        slideIn: "slideIn 0.6s ease-out forwards",
                    },
                    keyframes: {
                        slideIn: {
                            "0%": { opacity: "0", transform: "translateY(20px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" }
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
                {children}
            </svg>
        );

        const Menu = (p) => <IconWrapper {...p}><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></IconWrapper>;
        const X = (p) => <IconWrapper {...p}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></IconWrapper>;
        const MapPin = (p) => <IconWrapper {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></IconWrapper>;
        const Clock = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></IconWrapper>;
        const Calendar = (p) => <IconWrapper {...p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></IconWrapper>;
        const ChevronRight = (p) => <IconWrapper {...p}><path d="m9 18 6-6-6-6" /></IconWrapper>;
        const ChevronDown = (p) => <IconWrapper {...p}><path d="m6 9 6 6 6-6" /></IconWrapper>;
        const Heart = (p) => <IconWrapper {...p}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></IconWrapper>;
        const Users = (p) => <IconWrapper {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></IconWrapper>;
        const Coffee = (p) => <IconWrapper {...p}><path d="M17 8h1a4 4 0 1 1 0 8h-1" /><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" /><line x1="6" x2="6" y1="2" y2="4" /><line x1="10" x2="10" y1="2" y2="4" /><line x1="14" x2="14" y1="2" y2="4" /></IconWrapper>;
        const Music = (p) => <IconWrapper {...p}><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></IconWrapper>;
        const Baby = (p) => <IconWrapper {...p}><path d="M9 12h.01" /><path d="M15 12h.01" /><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5" /><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1" /></IconWrapper>;
        const Sparkles = (p) => <IconWrapper {...p}><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" /><path d="M5 3v4" /><path d="M19 17v4" /><path d="M3 5h4" /><path d="M17 19h4" /></IconWrapper>;

        const FacebookIcon = ({ size = 18 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.84c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z" /></svg>
        );
        const InstagramIcon = ({ size = 18 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" /></svg>
        );
        const YouTubeIcon = ({ size = 18 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z" /></svg>
        );

        const colors = { black: '#000000', white: '#FFFFFF', dark: '#424242', tealDark: '#0b6b6b', tealLight: '#76cdbd', cyan: '#4ecbcf', orange: '#e2572e', gold: '#f39615' };

        const GeometricMountains = ({ className, tone = "dark" }) => {
            const fills = tone === "light"
                ? { back: "rgba(255,255,255,0.08)", mid: "rgba(255,255,255,0.14)", front: "rgba(255,255,255,0.22)" }
                : { back: "rgba(11,107,107,0.35)", mid: "rgba(66,66,66,0.55)", front: colors.dark };
            return (
                <svg viewBox="0 0 1200 300" className={className} preserveAspectRatio="none" aria-hidden="true">
                    <path d="M0,300 L220,140 L420,300 Z" fill={fills.back} />
                    <path d="M280,300 L520,90 L760,300 Z" fill={fills.back} />
                    <path d="M640,300 L880,150 L1100,300 Z" fill={fills.back} />
                    <path d="M120,300 L380,170 L640,300 Z" fill={fills.mid} />
                    <path d="M520,300 L780,110 L1040,300 Z" fill={fills.mid} />
                    <path d="M0,300 L260,200 L520,300 Z" fill={fills.front} />
                    <path d="M460,300 L720,160 L980,300 Z" fill={fills.front} />
                    <path d="M860,300 L1100,210 L1200,300 L1200,300 Z" fill={fills.front} />
                </svg>
            );
        };

        const Logo = () => (
            <a href="index.html" className="flex items-center gap-2" aria-label="Temecula Hills Christian Fellowship — Home">
                <div className="relative w-10 h-10 overflow-hidden rounded-full bg-white border-2 border-gray-800 flex items-center justify-center">
                    <svg viewBox="0 0 100 100" className="w-8 h-8 mt-2">
                        <path d="M10,90 L35,40 L60,90 Z" fill={colors.dark} />
                        <path d="M40,90 L65,30 L90,90 Z" fill={colors.dark} />
                    </svg>
                </div>
                <div className="flex flex-col leading-tight">
                    <span className="font-bold text-lg tracking-wider text-gray-800">TEMECULA HILLS</span>
                    <span className="text-xs tracking-widest text-gray-500">CHRISTIAN FELLOWSHIP</span>
                </div>
            </a>
        );

        const NavItem = ({ label, href, delay, onClick, isOpen }) => (
            <a href={href} onClick={onClick}
                className={`block text-4xl md:text-6xl font-black text-white hover:text-orange duration-300 transform hover:translate-x-4 mb-6 md:mb-8 transition-all ${isOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}
                style={{ transitionDelay: `${isOpen ? delay : 0}ms`, transitionDuration: '500ms' }}>
                {label}
            </a>
        );

        const FullScreenMenu = ({ isOpen, onClose }) => {
            const [isRendered, setIsRendered] = useState(isOpen);
            const [shouldAnimate, setShouldAnimate] = useState(false);
            useEffect(() => {
                if (isOpen) { setIsRendered(true); setTimeout(() => setShouldAnimate(true), 50); }
                else { setShouldAnimate(false); const t = setTimeout(() => setIsRendered(false), 700); return () => clearTimeout(t); }
            }, [isOpen]);
            if (!isRendered) return null;
            return (
                <div className="fixed inset-0 z-50 flex flex-col bg-dark overflow-hidden transition-all duration-700 ease-[cubic-bezier(0.76,0,0.24,1)]"
                    style={{ clipPath: shouldAnimate ? 'circle(150% at calc(100% - 40px) 40px)' : 'circle(0% at calc(100% - 40px) 40px)' }}>
                    <div className="flex justify-between items-center p-6 md:p-12 relative z-10">
                        <div className="text-white font-bold tracking-widest text-sm transition-opacity duration-300 delay-300" style={{ opacity: shouldAnimate ? 1 : 0 }}>MENU</div>
                        <button onClick={onClose} className="text-white hover:text-orange transition-colors" aria-label="Close menu"><X size={32} /></button>
                    </div>
                    <div className="flex-1 grid md:grid-cols-[1.4fr_1fr] gap-12 px-8 md:px-24 pb-12 relative z-10 items-center">
                        <nav>
                            <NavItem label="HOME" href="index.html" delay={shouldAnimate ? 300 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="I'M NEW" href="im-new.html" delay={shouldAnimate ? 400 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="ABOUT" href="index.html#about" delay={shouldAnimate ? 500 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="SERMONS" href="index.html#sermons" delay={shouldAnimate ? 600 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            {/* TODO: replace href with church giving URL when set up. */}
                            <NavItem label="GIVE" href="index.html#contact" delay={shouldAnimate ? 700 : 0} onClick={onClose} isOpen={shouldAnimate} />
                            <NavItem label="CONTACT" href="index.html#contact" delay={shouldAnimate ? 800 : 0} onClick={onClose} isOpen={shouldAnimate} />
                        </nav>
                        <aside className="hidden md:block text-white/90 transition-all duration-700"
                            style={{ opacity: shouldAnimate ? 1 : 0, transform: shouldAnimate ? 'translateY(0)' : 'translateY(20px)', transitionDelay: shouldAnimate ? '600ms' : '0ms' }}>
                            <div className="border-l-2 border-orange pl-6 mb-8">
                                <div className="text-gold text-xs font-bold tracking-widest uppercase mb-2">Join Us</div>
                                <div className="font-bold text-lg leading-snug mb-1">Sundays at 10:00 AM</div>
                                <div className="text-white/70 text-sm">Wednesdays · Youth 7:00 PM</div>
                            </div>
                            <div className="border-l-2 border-tealLight pl-6 mb-8">
                                <div className="text-tealLight text-xs font-bold tracking-widest uppercase mb-2">Visit</div>
                                <div className="text-white/85 text-sm leading-relaxed">12345 Church Road<br />Temecula, CA 92592</div>
                            </div>
                            <a href="#plan-visit" onClick={onClose} className="inline-flex items-center gap-2 px-6 py-3 bg-orange hover:bg-[#c9451f] text-white font-bold rounded-lg transition-all">
                                Plan Your Visit <ChevronRight size={18} />
                            </a>
                        </aside>
                    </div>
                    <div className="absolute bottom-0 right-0 w-full h-32 opacity-30 pointer-events-none transition-opacity duration-500 delay-300" style={{ opacity: shouldAnimate ? 0.3 : 0 }}>
                        <GeometricMountains className="w-full h-full" tone="light" />
                    </div>
                </div>
            );
        };

        const SectionHeading = ({ children, color = "text-gray-800" }) => (
            <h2 className={`text-3xl md:text-5xl font-bold mb-8 tracking-tight leading-tight ${color}`}>{children}</h2>
        );

        const useOnScreen = (options) => {
            const [ref, setRef] = useState(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, options);
                if (ref) obs.observe(ref);
                return () => { if (ref) obs.unobserve(ref); };
            }, [ref, options]);
            return [setRef, visible];
        };

        const RevealOnScroll = ({ children, delay = 0 }) => {
            const [setRef, visible] = useOnScreen({ threshold: 0.1 });
            return (
                <div ref={setRef}
                    className={`transition-all duration-1000 transform ${visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}
                    style={{ transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        };
        const ExpectStep = ({ number, icon: Icon, title, body, color }) => (
            <div className="bg-white rounded-2xl p-8 shadow-sm hover:shadow-xl transition-all duration-300 ring-1 ring-gray-100 group h-full">
                <div className="flex items-start justify-between mb-5">
                    <div className="p-3 rounded-xl text-white shadow-sm group-hover:scale-110 transition-transform" style={{ backgroundColor: color }}>
                        <Icon size={22} />
                    </div>
                    <span className="text-5xl font-black text-gray-100 leading-none">{String(number).padStart(2, '0')}</span>
                </div>
                <h3 className="text-xl font-bold mb-2 text-gray-800">{title}</h3>
                <p className="text-gray-600 leading-relaxed">{body}</p>
            </div>
        );

        const KidsCard = ({ ageRange, title, description, icon: Icon, color }) => (
            <div className="bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-2xl transition-all duration-300 ring-1 ring-gray-100 group">
                <div className="p-8">
                    <div className="flex items-center gap-3 mb-4">
                        <div className="p-3 rounded-xl text-white shadow-sm" style={{ backgroundColor: color }}>
                            <Icon size={22} />
                        </div>
                        <span className="text-xs font-bold tracking-widest uppercase text-gray-500">{ageRange}</span>
                    </div>
                    <h3 className="text-2xl font-bold mb-3 text-gray-800">{title}</h3>
                    <p className="text-gray-600 leading-relaxed">{description}</p>
                </div>
                <div className="h-1.5" style={{ backgroundColor: color }}></div>
            </div>
        );

        const TimelineItem = ({ time, title, description, isLast }) => (
            <div className="relative flex gap-6 pb-10 last:pb-0">
                {!isLast && <div className="absolute left-[19px] top-12 bottom-0 w-0.5 bg-tealLight/40"></div>}
                <div className="relative shrink-0 w-10 h-10 rounded-full bg-tealDark flex items-center justify-center text-white shadow-md ring-4 ring-white">
                    <Clock size={16} />
                </div>
                <div className="pt-1.5">
                    <div className="text-tealDark font-bold text-sm tracking-wider uppercase mb-1">{time}</div>
                    <h4 className="text-lg font-bold text-gray-800 mb-1">{title}</h4>
                    <p className="text-gray-600 leading-relaxed">{description}</p>
                </div>
            </div>
        );

        const FAQItem = ({ question, answer }) => {
            const [open, setOpen] = useState(false);
            return (
                <div className="border-b border-gray-200 last:border-b-0">
                    <button
                        onClick={() => setOpen(!open)}
                        className="w-full flex items-center justify-between py-5 text-left group focus:outline-none focus-visible:ring-2 focus-visible:ring-orange/60 rounded"
                        aria-expanded={open}
                    >
                        <span className="font-bold text-lg text-gray-800 group-hover:text-tealDark transition-colors pr-6">{question}</span>
                        <ChevronDown size={22} className={`shrink-0 text-tealDark transition-transform ${open ? 'rotate-180' : ''}`} />
                    </button>
                    <div className={`grid transition-all duration-300 ease-out ${open ? 'grid-rows-[1fr] opacity-100 pb-5' : 'grid-rows-[0fr] opacity-0'}`}>
                        <div className="overflow-hidden">
                            <p className="text-gray-600 leading-relaxed">{answer}</p>
                        </div>
                    </div>
                </div>
            );
        };

        // NOTE: This is a static/prototype form. On GHL, replace this whole block
        // with a native GHL form widget so submissions land in the CRM and trigger workflows.
        const VisitForm = () => {
            const [submitted, setSubmitted] = useState(false);
            return (
                <form
                    onSubmit={(e) => { e.preventDefault(); setSubmitted(true); }}
                    className="bg-white rounded-2xl p-8 md:p-10 shadow-2xl ring-1 ring-gray-100 space-y-5"
                >
                    {submitted ? (
                        <div className="text-center py-8">
                            <div className="w-14 h-14 rounded-full bg-tealLight/20 text-tealDark flex items-center justify-center mx-auto mb-4">
                                <Heart size={28} />
                            </div>
                            <h3 className="text-2xl font-bold text-gray-800 mb-2">We can't wait to meet you!</h3>
                            <p className="text-gray-600">Look out for a welcome email shortly with everything you need for Sunday.</p>
                        </div>
                    ) : (
                        <>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2 tracking-wide" htmlFor="vf-name">Your Name</label>
                                <input id="vf-name" name="name" required type="text" placeholder="Jane Doe"
                                    className="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-tealDark focus:ring-2 focus:ring-tealDark/20 outline-none transition" />
                            </div>
                            <div className="grid md:grid-cols-2 gap-5">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2 tracking-wide" htmlFor="vf-email">Email</label>
                                    <input id="vf-email" name="email" required type="email" placeholder="jane@example.com"
                                        className="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-tealDark focus:ring-2 focus:ring-tealDark/20 outline-none transition" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2 tracking-wide" htmlFor="vf-phone">Phone <span className="text-gray-400 font-normal">(optional)</span></label>
                                    <input id="vf-phone" name="phone" type="tel" placeholder="(555) 555-5555"
                                        className="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-tealDark focus:ring-2 focus:ring-tealDark/20 outline-none transition" />
                                </div>
                            </div>
                            <div className="grid md:grid-cols-2 gap-5">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2 tracking-wide" htmlFor="vf-sunday">Which Sunday?</label>
                                    <select id="vf-sunday" name="sunday"
                                        className="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-tealDark focus:ring-2 focus:ring-tealDark/20 outline-none transition bg-white">
                                        <option>This Sunday</option>
                                        <option>Next Sunday</option>
                                        <option>I'm not sure yet</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2 tracking-wide" htmlFor="vf-kids">Bringing kids?</label>
                                    <select id="vf-kids" name="kids"
                                        className="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-tealDark focus:ring-2 focus:ring-tealDark/20 outline-none transition bg-white">
                                        <option>Just me / us</option>
                                        <option>Yes — nursery (0–3)</option>
                                        <option>Yes — elementary (4–11)</option>
                                        <option>Yes — youth (12–18)</option>
                                        <option>Yes — multiple ages</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2 tracking-wide" htmlFor="vf-notes">Anything we should know? <span className="text-gray-400 font-normal">(optional)</span></label>
                                <textarea id="vf-notes" name="notes" rows="3" placeholder="Questions, accessibility needs, prayer requests…"
                                    className="w-full px-4 py-3 rounded-lg border border-gray-200 focus:border-tealDark focus:ring-2 focus:ring-tealDark/20 outline-none transition resize-none"></textarea>
                            </div>
                            <button type="submit"
                                className="w-full inline-flex items-center justify-center gap-2 px-8 py-4 bg-orange hover:bg-[#c9451f] text-white font-bold rounded-lg transition-all transform hover:scale-[1.02] shadow-lg">
                                Plan My Visit <ChevronRight size={20} />
                            </button>
                            <p className="text-xs text-gray-400 text-center">We'll never share your info. Expect a personal welcome email within 24 hours.</p>
                        </>
                    )}
                </form>
            );
        };
        function App() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="font-sans text-gray-800 bg-gray-50 min-h-screen selection:bg-tealLight selection:text-white">
                    <FullScreenMenu isOpen={isMenuOpen} onClose={() => setIsMenuOpen(false)} />

                    <header className={`fixed top-0 left-0 right-0 z-40 transition-all duration-300 px-6 flex justify-between items-center ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-sm py-3' : 'bg-white/80 backdrop-blur-sm py-4'}`}>
                        <Logo />
                        <button
                            onClick={() => setIsMenuOpen(true)}
                            className={`group flex items-center gap-3 px-4 py-2 rounded-full transition-all ${scrolled ? 'bg-gray-100 hover:bg-gray-200' : 'bg-gray-100/80 hover:bg-gray-200'}`}
                            aria-label="Open navigation menu"
                        >
                            <span className="hidden md:block font-bold text-sm tracking-widest uppercase text-gray-800">Menu</span>
                            <div className="p-2 bg-dark text-white rounded-full group-hover:bg-orange transition-colors">
                                <Menu size={20} />
                            </div>
                        </button>
                    </header>

                    {/* --- Hero --- */}
                    <section className="relative pt-32 pb-24 md:pt-40 md:pb-32 px-6 bg-gradient-to-b from-tealDark via-tealDark to-[#085050] text-white overflow-hidden">
